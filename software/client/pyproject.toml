# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "padauk_prog"
dynamic = ["version"]
description = "PC client for the PADAUK smart programmer"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdkprog = "padauk_prog.cli:main"

[tool.setuptools]
packages = ["padauk_prog"]

[tool.setuptools.dynamic]
version = { attr = "padauk_prog.__version__" }
