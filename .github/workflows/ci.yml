# SPDX-License-Identifier: GPL-3.0-or-later
# T126: the simulator and unit tests on Linux and Windows, the client's unit and contract tests against
# pdk-sim (fault injection with reduced iterations; the full runs on demand), the STM32 firmware with
# its size check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Full fault-injection iterations (no PDK_FAST)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: docs/protocol.md matches the contracts
        if: runner.os == 'Linux'
        run: python docs/gen_protocol.py --check

      - name: Engine reference traces match their generator
        if: runner.os == 'Linux'
        run: python software/tests/vectors/gen_traces.py --check

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S software/firmware -B build/host -DPLATFORM=host -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows, MinGW gcc)
        if: runner.os == 'Windows'
        run: cmake -S software/firmware -B build/host -G "MinGW Makefiles" -DPLATFORM=host -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build build/host --parallel 4

      - name: Unit tests (ctest)
        run: ctest --test-dir build/host --output-on-failure

      - name: Client
        run: python -m pip install -e "software/client[dev]"

      - name: Client unit and contract tests
        shell: bash
        run: |
          sim=build/host/pdk-sim
          if [ "$RUNNER_OS" = "Windows" ]; then sim=$sim.exe; fi
          if [ "$FULL" != "true" ]; then export PDK_FAST=1; fi   # reduced fault-injection iterations
          python -m pytest software/client/tests -q --sim "$sim"

  stm32:
    name: firmware (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: stm32g474
            toolchain: arm-cortex-m4f.cmake
            bin: pdkprog-g474.bin
    steps:
      - uses: actions/checkout@v4

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Configure
        run: >
          cmake -S software/firmware -B build/${{ matrix.target }} -DPLATFORM=${{ matrix.target }}
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/software/firmware/cmake/${{ matrix.toolchain }}

      - name: Build (with the size check)
        run: cmake --build build/${{ matrix.target }} --parallel 4

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-firmware
          path: |
            build/${{ matrix.target }}/*.bin
            build/${{ matrix.target }}/*.elf
            build/${{ matrix.target }}/*.map
